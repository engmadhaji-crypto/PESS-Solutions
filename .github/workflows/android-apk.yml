name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Build debug APK
        working-directory: android
        run: ./gradlew clean assembleDebug --stacktrace

      - name: Check APK package metadata
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging android/app/build/outputs/apk/debug/app-debug.apk | grep -E "package: name='com.pees.agents'|sdkVersion|targetSdkVersion"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pess-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
